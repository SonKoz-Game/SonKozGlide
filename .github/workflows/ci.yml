name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.16.0

      - name: Build application
        shell: pwsh
        run: |
          $version = & ./scripts/version.ps1
          wails build -ldflags "-s -w -H windowsgui -X github.com/SonKoz-Game/SonKozGlide/internal/updater.Version=v$version"

      - uses: actions/upload-artifact@v7
        with:
          name: SonKozGlide
          path: build/bin/SonKozGlide.exe
