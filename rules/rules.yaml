version: "2026.09.30-1"

platforms:

  discord:
    aliases: [discordapp]
    categories:
      auth_api:
        domains: [discord.com, discordapp.com]
      gateway_rtc:
        domains: [discord.gg, discord.media]
        asn: [AS49544]
      media_cdn:
        domains: [discordapp.net, discordcdn.com]
      status:
        domains: [discordstatus.com, dis.gd]
      short_links:
        domains: [discord.co]
      third_party:
        domains: [tenor.com, tenor.googleapis.com]

  roblox:
    categories:
      auth_api:
        domains: [roblox.com]
      assets_cdn:
        domains: [rbxcdn.com, rbxgcdn.com, rbximg.com, rbxtok.com, rbxasm.com, rbxmgr.com]
      dev_meta:
        domains: [rbxapidev.com, robloxlabs.com]
      game_servers:
        asn: [AS22697]
        note: "UDP oyun trafigi IP ile; yalniz ASN/CIDR ile yonlendirilebilir"

  openai:
    categories:
      web_app:
        domains: [openai.com, chatgpt.com, sora.com]
      static_assets:
        domains: [oaistatic.com]
      user_content:
        domains: [oaiusercontent.com]
      auth:
        domains: [auth0.openai.com, auth.openai.com]
      cdn_challenge:
        keywords: [openai, oaistatic, oaiusercontent]

  telegram:
    categories:
      web_api:
        domains: [telegram.org, telegram.me, t.me, telesco.pe, telegra.ph, telegram.dog, tdesktop.com]
      dc_backbone:
        asn: [AS62041, AS62014, AS59930, AS44907, AS62240]
        ip_cidr:
          - 91.108.4.0/22
          - 91.108.8.0/22
          - 91.108.12.0/22
          - 91.108.16.0/22
          - 91.108.56.0/22
          - 149.154.160.0/20
          - 2001:67c:4e8::/48
          - 2001:b28:f23c::/48
          - 2001:b28:f23d::/48
          - 2001:b28:f23f::/48

  youtube:
    aliases: [googlevideo]
    categories:
      web_api:
        domains: [youtube.com, youtu.be, youtube-nocookie.com]
      media_cdn:
        wildcards: ["*.googlevideo.com"]
        domains: [ytimg.com, ggpht.com]
      infra:
        keywords: [googlevideo]

  meta:
    aliases: [instagram, whatsapp, facebook]
    categories:
      instagram:
        domains: [instagram.com, cdninstagram.com]
      whatsapp:
        domains: [whatsapp.com, whatsapp.net]
      shared_cdn:
        domains: [fbcdn.net]
        wildcards: ["*.fbcdn.net"]
